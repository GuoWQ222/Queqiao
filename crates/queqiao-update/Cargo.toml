[package]
name = "queqiao-update"
description = "Signed update feed: the manifest, its Ed25519 signature by the release key, and the installer download"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Ed25519 (ring is already in the build through rustls).
ring = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Security_Cryptography",
] }
