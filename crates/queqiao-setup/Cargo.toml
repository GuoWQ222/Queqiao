[package]
name = "queqiao-setup"
description = "Installs Queqiao for the person using this PC, with the Queqiao service, and removes it again"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Test builds: `--no-service` (the person's own installation alone, for the update tests). Never in a shipping build.
test-switches = ["queqiao-update/test-key"]

[dependencies]
queqiao-core.workspace = true
queqiao-display.workspace = true
queqiao-update.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
queqiao-vdisplay.workspace = true
windows = { workspace = true, features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    # SetupQueryInfOriginalFileInformationW (display_driver: the driver's packages in the driver store).
    "Win32_System_Diagnostics_Debug",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
