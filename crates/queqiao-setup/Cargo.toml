[package]
name = "queqiao-setup"
description = "Installs Queqiao for the person using this PC, with the Queqiao service, and removes it again"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Test builds: `--no-service` (the person's own installation alone, for the update tests). Never in a shipping build.
test-switches = []

[dependencies]
queqiao-core.workspace = true
queqiao-display.workspace = true
queqiao-update.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
