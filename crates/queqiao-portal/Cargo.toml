[package]
name = "queqiao-portal"
description = "Linux, Wayland: the desktop portal session (ScreenCast, RemoteDesktop) the capture and the input share"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]

# The portals over D-Bus (zbus, as the tray), run on async-io.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screencast", "remote_desktop"] }
async-io = "2"
enumflags2 = "0.7"
libc = "0.2"
# GNOME's own screen cast and remote desktop interfaces (the opt-in path without the portal's question).
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
