[package]
name = "queqiao-account"
description = "Client side of queqiao-server: pinned TLS WebSocket, login, device list, session signaling"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Test builds (the agent's and viewer's test-switches): saved logins and pins in files of their own, never the person's.
test-files = []

[dependencies]
queqiao-core.workspace = true
queqiao-transport.workspace = true
# Ed25519 device keys (ring is already in the build through rustls).
ring = "0.17"
getrandom.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_SystemInformation"] }
