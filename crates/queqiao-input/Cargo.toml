[package]
name = "queqiao-input"
description = "Input on the controlled PC (SendInput on Windows, XTEST under X11) and the clipboard shared between viewer and agent"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
queqiao-core.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# X11 (docs/LINUX.md): the XTEST extension.
[target.'cfg(target_os = "linux")'.dependencies]
# The clipboard (clipboard_x11.rs): XFixes tells of new owners; libc to wait on the display; PNG for images.
x11rb = { version = "0.13", features = ["xtest", "xfixes"] }
libc = "0.2"
png = "0.17"
# Wayland (wayland.rs): the wlroots virtual pointer and the virtual keyboard protocol.
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
# GNOME, KDE: input through the RemoteDesktop portal session shared with the capture.
queqiao-portal.workspace = true
