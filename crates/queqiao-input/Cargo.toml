[package]
name = "queqiao-input"
description = "Input on the controlled PC: injects the viewer's mouse and keyboard events with SendInput"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
queqiao-core.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
