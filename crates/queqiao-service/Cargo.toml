[package]
name = "queqiao-service"
description = "Windows service: the desktop helper for the sign-in, lock and UAC screens, and the agent of the person signed in"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
queqiao-capture.workspace = true
queqiao-core.workspace = true
queqiao-display.workspace = true
queqiao-input.workspace = true
queqiao-local.workspace = true
queqiao-update.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
