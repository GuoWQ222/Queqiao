[package]
name = "queqiao-service"
description = "The service (Windows: LocalSystem; Linux: root under systemd): the desktop helper for the sign-in, lock and UAC screens, and the agent of the person signed in"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Extra agent options stored by the tests (install --agent-arguments / --logon-arguments). Never in a shipping build.
test-switches = []

[dependencies]
queqiao-capture.workspace = true
queqiao-core.workspace = true
queqiao-display.workspace = true
queqiao-input.workspace = true
queqiao-local.workspace = true
queqiao-update.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

# Linux (docs/LINUX.md): logind over the system bus (zbus, as the portals and the tray), libc for processes, users and
# capabilities; KMS capture and uinput come from queqiao-capture and queqiao-input, PAM from queqiao-core.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
libc = "0.2"
