[package]
name = "queqiao-codec"
description = "Video codec: BGRA -> NV12, H.264 encoders (Media Foundation, NVENC, OpenH264) and decoders"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
queqiao-core.workspace = true
openh264 = "0.9"
# The raw option for changing the bitrate while encoding (openh264 does not wrap it).
openh264-sys2 = "0.9"

[dev-dependencies]
queqiao-capture.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D10",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_System_Threading", "Win32_UI_HiDpi"] }

# Linux (docs/LINUX.md): the captured frames and the device handles.
[target.'cfg(target_os = "linux")'.dependencies]
queqiao-capture.workspace = true
