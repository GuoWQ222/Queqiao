[package]
name = "queqiao-mobile"
description = "The core of Queqiao's phone and tablet apps (Android, iOS): the account, sessions as a viewer, input; a C interface (JNI on Android)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# rlib for the tests and probes; staticlib for iOS (an XCFramework); cdylib for Android (libqueqiao_mobile.so).
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
queqiao-core.workspace = true
queqiao-account.workspace = true
queqiao-transport.workspace = true
serde_json = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

# str0m's crypto on Android and iOS: OpenSSL built from source for the phone (no system OpenSSL there).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

# The PC's sound decoded into samples for iOS (src/pcm.rs); Android decodes Opus with MediaCodec.
[target.'cfg(not(target_os = "android"))'.dependencies]
opusic-sys = "0.7"

[dev-dependencies]
# examples/test_agent: a stand-in PC streaming a test picture (the iOS Simulator's tests on a Mac).
openh264 = "0.9"
