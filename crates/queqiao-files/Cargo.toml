[package]
name = "queqiao-files"
description = "File transfer between viewer and agent over the files data channel: offers, chunks, SHA-256 checks"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Test builds (the agent's and viewer's test-switches): the list of transfers in a file of its own, never the person's.
test-files = []

[dependencies]
queqiao-core.workspace = true
sha2.workspace = true
# Clipboard images (clip.rs): LZ4 blocks, decoded in safe Rust (the data comes from the other side).
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
