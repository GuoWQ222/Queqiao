[package]
name = "queqiao-files"
description = "File transfer between viewer and agent over the files data channel: offers, chunks, SHA-256 checks"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Test builds (the agent's and viewer's test-switches): the list of transfers in a file of its own, never the person's.
test-files = []

[dependencies]
sha2.workspace = true
windows = { workspace = true, features = ["Win32_Storage_Compression", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_UI_Shell"] }
