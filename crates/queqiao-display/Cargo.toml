[package]
name = "queqiao-display"
description = "Viewer display: a window and a presenter for decoded NV12 pictures (GPU, CPU fallback)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
queqiao-capture.workspace = true
queqiao-codec.workspace = true
queqiao-core.workspace = true
windows = { workspace = true, features = [
    "Win32_Graphics_Direct3D",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
] }
