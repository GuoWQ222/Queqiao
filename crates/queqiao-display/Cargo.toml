[package]
name = "queqiao-display"
description = "Viewer display: a window and a presenter for decoded NV12 pictures (GPU, CPU fallback)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
queqiao-core.workspace = true

[dev-dependencies]
queqiao-capture.workspace = true
queqiao-codec.workspace = true
queqiao-core.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = [
    "Win32_Graphics_Direct3D",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
] }

# Linux (docs/LINUX.md): the session window on X11, the decoded pictures, keys through the evdev table.
[target.'cfg(target_os = "linux")'.dependencies]
queqiao-capture.workspace = true
queqiao-codec.workspace = true
queqiao-input.workspace = true
x11rb = { version = "0.13", features = ["shm", "randr", "render"] }
libc = "0.2"
# The GUI (linux/gui.rs): egui through eframe (OpenGL), on a thread of its own (winit's any-thread event loop).
eframe = { version = "0.32", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "rwh_06"] }
# The tray icon: a StatusNotifierItem over D-Bus (pure Rust); the icon's PNG images.
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
png = "0.17"
