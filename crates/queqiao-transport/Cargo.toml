[package]
name = "queqiao-transport"
description = "WebRTC transport (str0m, sans-IO): ICE, DTLS-SRTP, H.264 over RTP, data channel; signaling"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
queqiao-core.workspace = true
getrandom.workspace = true
socket2 = "0.6"
# str0m's SCTP, for its retransmission timeouts (patched: the workspace's third_party\sctp-proto).
sctp-proto = "0.10.8"
# The file channel over QUIC (quic.rs): the protocol machine (sans-IO, ring for its crypto), and the session's
# self-signed certificates.
quinn-proto = { version = "0.11.19", default-features = false, features = ["rustls-ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls.workspace = true
rustls-pki-types.workspace = true
sha2.workspace = true
bytes = "1"

[target.'cfg(windows)'.dependencies]
# Windows' own crypto (CNG) for DTLS: no C toolchain or CMake needed, x64 and ARM64.
str0m = { version = "0.25", default-features = false, features = ["wincrypto"] }
windows = { workspace = true, features = [
    "Win32_Media",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# The system's OpenSSL for DTLS and SRTP (docs/LINUX.md): the distribution keeps it patched; libssl3 is in every
# current Ubuntu and Debian.
str0m = { version = "0.25", default-features = false, features = ["openssl"] }
