[package]
name = "queqiao-agent"
description = "Controlled side: captures and streams the screen, injects the viewer's input"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Options and registry values for the tests (--connect, --listen, --answer, --report, UpdateFeed ...). Never in a
# shipping build: tests build with `cargo build-test` (.cargo\config.toml), scripts\package.ps1 -Ship without it.
test-switches = ["queqiao-account/test-files", "queqiao-files/test-files", "queqiao-update/test-key"]

[dependencies]
queqiao-account.workspace = true
queqiao-capture.workspace = true
queqiao-codec.workspace = true
queqiao-audio.workspace = true
queqiao-display.workspace = true
queqiao-files.workspace = true
queqiao-terminal.workspace = true
queqiao-tunnel.workspace = true
queqiao-core.workspace = true
queqiao-input.workspace = true
queqiao-local.workspace = true
queqiao-update.workspace = true
queqiao-transport.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
# Super Screen: the virtual monitor arranged in the person's session (the service adds it).
queqiao-vdisplay.workspace = true
windows = { workspace = true, features = [
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Globalization",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Shutdown",
    "Win32_System_Services",
    "Win32_System_Threading",
] }

# Linux (docs/LINUX.md): the session banner on the X display.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
# Which way the Wayland session opens (GNOME's own interfaces when the person turned that on).
queqiao-portal.workspace = true
# The account's name and number, and closing this process to others when the service started it.
libc = "0.2"
