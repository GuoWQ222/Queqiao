[package]
name = "queqiao-capture"
description = "Screen capture: DXGI desktop duplication on Windows (frames stay on the GPU), MIT-SHM under X11 and the ScreenCast portal on Wayland on Linux"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]

[dev-dependencies]
# The Wayland input probe (examples/wayland_input_probe.rs).
queqiao-core.workspace = true
queqiao-input.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Performance",
] }

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = [
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
] }

# X11 (docs/LINUX.md): the protocol in Rust, with the extensions capture needs; shared memory through libc.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["shm", "xfixes", "randr", "damage"] }
libc = "0.2"
# Wayland: the portal session shared with the input (queqiao-portal).
queqiao-portal.workspace = true
