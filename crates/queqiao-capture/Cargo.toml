[package]
name = "queqiao-capture"
description = "Screen capture: DXGI desktop duplication on Windows (frames stay on the GPU), MIT-SHM under X11 and the ScreenCast portal on Wayland on Linux"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]

[dev-dependencies]

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Performance",
] }

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = [
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
] }

# X11 (docs/LINUX.md): the protocol in Rust, with the extensions capture needs; shared memory through libc.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["shm", "xfixes", "randr", "damage"] }
libc = "0.2"
# Wayland: the ScreenCast portal over D-Bus (zbus, as the tray), run on async-io.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screencast", "remote_desktop"] }
async-io = "2"
enumflags2 = "0.7"
