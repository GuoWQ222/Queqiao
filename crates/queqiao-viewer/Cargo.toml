[package]
name = "queqiao-viewer"
description = "Controlling side: shows the remote screen and sends mouse and keyboard input"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Options for the tests (--connect, --listen, --server, --report, --send-file ...). Never in a shipping build: tests
# build with `cargo build-test` (.cargo\config.toml), scripts\package.ps1 -Ship without it.
test-switches = ["queqiao-account/test-files", "queqiao-files/test-files"]

[dependencies]
queqiao-account.workspace = true
queqiao-capture.workspace = true
queqiao-codec.workspace = true
queqiao-core.workspace = true
queqiao-audio.workspace = true
queqiao-display.workspace = true
queqiao-files.workspace = true
queqiao-terminal.workspace = true
queqiao-tunnel.workspace = true
queqiao-input.workspace = true
queqiao-transport.workspace = true
# The viewer's own settings (its keys).
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
] }
