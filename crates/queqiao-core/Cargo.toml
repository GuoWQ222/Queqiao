[package]
name = "queqiao-core"
description = "Shared code: the viewer-agent and device-server protocols, test switches, process set-up"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
# STUN/TURN message integrity (HMAC-SHA1, long-term keys with MD5) and FINGERPRINT (CRC-32).
crc32fast = "1"
hmac = "0.12"
md-5 = "0.10"
sha1 = "0.10"

[dev-dependencies]
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
] }
