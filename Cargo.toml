# Queqiao Cargo workspace. Components and milestones: docs\DESIGN.md.
[workspace]
resolver = "3"
members = ["crates/*"]
# Third-party crates with a change of ours (each folder's QUEQIAO.md), used through [patch] below, not members.
exclude = ["third_party"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
queqiao-core = { path = "crates/queqiao-core" }
queqiao-capture = { path = "crates/queqiao-capture" }
queqiao-codec = { path = "crates/queqiao-codec" }
queqiao-display = { path = "crates/queqiao-display" }
queqiao-input = { path = "crates/queqiao-input" }
queqiao-transport = { path = "crates/queqiao-transport" }
windows = "0.62"
queqiao-account = { path = "crates/queqiao-account" }
queqiao-audio = { path = "crates/queqiao-audio" }
queqiao-files = { path = "crates/queqiao-files" }
queqiao-terminal = { path = "crates/queqiao-terminal" }
queqiao-local = { path = "crates/queqiao-local" }
queqiao-update = { path = "crates/queqiao-update" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TLS everywhere with the ring crypto backend (aws-lc, rustls' default, would need CMake on every build machine).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
sha2 = "0.11"
getrandom = "0.3"

# sctp-proto (str0m's SCTP for the data channels) with settable retransmission timeouts: third_party\sctp-proto.
[patch.crates-io]
sctp-proto = { path = "third_party/sctp-proto" }

# OpenH264 is C++ built by the cc crate. Unoptimised it is many times slower, which would hide real encode
# times even in debug builds.
[profile.dev.package.openh264-sys2]
opt-level = 3
