# Queqiao Cargo workspace. Components and milestones: docs\DESIGN.md.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
queqiao-core = { path = "crates/queqiao-core" }
queqiao-capture = { path = "crates/queqiao-capture" }
queqiao-codec = { path = "crates/queqiao-codec" }
queqiao-display = { path = "crates/queqiao-display" }
queqiao-input = { path = "crates/queqiao-input" }
queqiao-transport = { path = "crates/queqiao-transport" }
windows = "0.62"

# OpenH264 is C++ built by the cc crate. Unoptimised it is many times slower, which would hide real encode
# times even in debug builds.
[profile.dev.package.openh264-sys2]
opt-level = 3
