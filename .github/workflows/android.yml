# The Android app: built (the Rust core for arm64-v8a and x86_64 with the NDK, the APK with Gradle) and tested end to
# end in an Android emulator against a queqiao-server and a Linux agent on the same runner (scripts/run_android_e2e.sh).
# The APK is kept as the run's artifact; the test's pictures and logs are pushed to the branch ci-results-android
# (replaced each run).
name: android

on:
  push:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - 'crates/**'
      - 'Cargo.lock'
      - 'scripts/build_mobile_core.sh'
      - 'scripts/build_android.sh'
      - 'scripts/run_android_e2e.sh'
      - '.github/workflows/android.yml'
  workflow_dispatch:

# Read only (security review of 2026-11-27): the build and test job runs third-party actions (each pinned to a commit),
# which never get a token that can write to the repository; only the small `results` job below, which runs no third-
# party code but GitHub's own download action, may push the results branch.
permissions:
  contents: read

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.10.2'

      - name: Rust targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build the app
        run: |
          set -o pipefail
          mkdir -p /tmp/android_e2e
          export NDK_HOME=$ANDROID_NDK_LATEST_HOME
          bash scripts/build_android.sh debug 2>&1 | tee /tmp/android_e2e/build.txt
          (cd mobile/android && gradle -q assembleDebugAndroidTest) 2>&1 | tee -a /tmp/android_e2e/build.txt

      - name: Build the server and the Linux agent
        run: |
          sudo apt-get update -q
          # The agent's windows (egui on OpenGL through Mesa, winit on X11), the test's clock.
          sudo apt-get install -y -q xvfb x11-apps libegl1 libgl1 libgl1-mesa-dri libglx-mesa0 libegl-mesa0 \
            libgbm1 libwayland-egl1 libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 fonts-dejavu-core
          set -o pipefail
          cargo build -q --release --features queqiao-agent/test-switches -p queqiao-server -p queqiao-agent 2>&1 | tee /tmp/android_e2e/build_agent.txt

      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: End to end in the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: OUT=/tmp/android_e2e/e2e bash scripts/run_android_e2e.sh | tee /tmp/e2e_summary.txt

      - name: Pass or fail
        run: tail -1 /tmp/e2e_summary.txt | grep -q ANDROID_E2E_PASS

      - name: Results for ci-results-android
        if: always()
        run: |
          mkdir -p /tmp/android_e2e
          cp target/android-gradle.log target/mobile-*.log /tmp/android_e2e/ 2> /dev/null || true
          cp /tmp/e2e_summary.txt /tmp/android_e2e/ 2> /dev/null || true
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk /tmp/android_e2e/queqiao.apk 2> /dev/null || true
          echo "run ${{ github.run_number }} of ${{ github.sha }}" > /tmp/android_e2e/RUN.txt
          cd /tmp/android_e2e
          # Keys and logins out; the agent's crash reports and session list (in its state folder) kept.
          rm -rf e2e/config e2e/run e2e/server
          find e2e/state -type f ! -name '*.log' ! -path '*crashes*' -delete 2> /dev/null || true
          echo collected

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: results
          path: /tmp/android_e2e
          if-no-files-found: ignore

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: queqiao-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

  results:
    # Pushes the results branch: write access only here, and no third-party code.
    needs: android
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: results
          path: results
      - name: Results to ci-results-android
        run: |
          cd results
          # A fresh repository: nothing from the build job's files configures git here (no .git, hooks or config).
          rm -rf .git
          git init -q
          git checkout -q -b results
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "android run ${{ github.run_number }}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" results:ci-results-android
